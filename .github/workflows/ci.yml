# Thin caller of core's reusable per-repo CI (req-tap-plugin-extdev-repo-ci). Two pins,
# independent (req-tap-plugin-extdev-repo-ci-9): the `uses:` SHA pins WHICH validation
# logic runs; the plugin's manifest `requires_tap` pins WHICH core it runs against; the
# harness is core at the tag v<floor>, resolved by the workflow (req-tap-plugin-extdev-repo-ci-7).
# The in-package tap_plugin/qualys/boot/ci.boot.json is the opt-in (req-boot-bootstrap-ci-record-6).
# The `uses:` pin is tap v0.5.0 at af6c940e52bc (2026-11-25), the release qualys requires.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tap:
    # A job-level block replaces the top-level one, so it restates contents: read. plugin-ci
    # uploads its dependency scan as SARIF, which needs security-events: write; GitHub refuses
    # the whole call at startup without it (tap#772). Never contents: write.
    permissions:
      contents: read
      security-events: write
    uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@af6c940e52bc68b50add3b9ff63e600da8265e58
    with:
      plugin_slug: qualys
      # The ci record installs aws_core (a declared, optional dependency), and aws_core's migrate is the
      # boot's long pole (plugin-ci.yml: ~13 minutes of a 13.5-minute boot, longer on a cold runner). At the
      # 25-minute default the job was cancelled still migrating, with no test run (PR #10, 2026-11-20).
      # aws-core-tap's own caller sets 75; this matches it.
      boot_and_test_timeout_minutes: 75
